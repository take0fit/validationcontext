# Taskfile.yaml
version: '3'

vars:
  APP_NAME: validationcontext
  GO_VERSION: 1.24.3

tasks:
  default:
    desc: "デフォルトタスク - すべてのテストを実行"
    cmds:
      - task: test-all

  install-gen:
    desc: "コード生成ツールをインストール"
    cmds:
      - go install ./cmd/voauto-gen

  generate:
    desc: "レジストリファイルを生成"
    deps: [install-gen]
    cmds:
      - go generate ./...

  clean:
    desc: "生成されたファイルを削除"
    cmds:
      - find . -name "registry_init.go" -delete

  build:
    desc: "プロジェクトをビルド"
    deps: [generate]
    cmds:
      - go build ./...

  test-user:
    desc: "ユーザープロファイルテストを実行"
    deps: [generate]
    cmds:
      - echo "Running User Profile Tests..."
      - go run ./example/cmd/user_profile_test/main.go

  test-all:
    desc: "すべてのテストを実行"
    deps: [generate]
    cmds:
      - echo "Running All Validation Tests..."
      - go run ./example/cmd/all_tests/main.go

  test-performance:
    desc: "パフォーマンステストを実行"
    deps: [generate]
    cmds:
      - echo "Running Performance Tests..."
      - go run ./example/cmd/performance_test/main.go

  test-full:
    desc: "完全なテストスイートを実行"
    deps: [test-user, test-book, test-conversion, test-all, test-performance]
    cmds:
      - echo "All tests completed!"

  dev:
    desc: "開発ワークフロー（クリーン + 生成 + テスト）"
    cmds:
      - task: clean
      - task: install-gen
      - task: generate
      - task: test-all

  lint:
    desc: "コードをlint"
    cmds:
      - go vet ./...
      - go fmt ./...

  mod-tidy:
    desc: "go.modを整理"
    cmds:
      - go mod tidy

  help:
    desc: "利用可能なタスクを表示"
    cmds:
      - echo "利用可能なタスク:"
      - echo "  install-gen     - コード生成ツールをインストール"
      - echo "  generate        - レジストリファイルを生成"
      - echo "  clean           - 生成されたファイルを削除"
      - echo "  build           - プロジェクトをビルド"
      - echo "  test-user       - ユーザープロファイルテスト"
      - echo "  test-book       - Bookエンティティテスト"
      - echo "  test-conversion - 型変換テスト"
      - echo "  test-all        - すべてのテスト"
      - echo "  test-performance- パフォーマンステスト"
      - echo "  test-full       - 完全なテストスイート"
      - echo "  dev             - 開発ワークフロー"
      - echo "  lint            - コードlint"
      - echo "  mod-tidy        - go.mod整理"